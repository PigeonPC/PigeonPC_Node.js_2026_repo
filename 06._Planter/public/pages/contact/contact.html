<h1>Contact us</h1>

<p>Submit a message below if you have any questions or feedback</p>


<form action="/api/contact" method="POST">
    <fieldset>
        <label for="topic">Topic</label>
        <input id="topic" name="topic" placeholder="topic" value="Testdata">

        <label for="name">Name</label>
        <input id="name" name="name" placeholder="name" value="Testdata">

        <label for="email">Email</label>
        <input type="email" name="email" id="email" required placeholder="email" value="test@test.dk">

        <label for="message">Message</label>
        <textarea placeholder="message..." name="message" rows="15" cols="60">Test tekst</textarea>

        <button>Contact</button>
    </fieldset>

</form>
